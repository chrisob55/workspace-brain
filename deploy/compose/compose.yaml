services:
  workspace-brain-api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        TURBO_BUILD_ARGS: ${TURBO_BUILD_ARGS:-}
    command: ['node', 'apps/workspace-brain-api/dist/main.js']
    environment:
      CATALOGUE_PATH: /var/lib/workspace-brain/catalogue.duckdb
      CONFIG_PATH: /app/config/workspace-brain.yaml
      DUCKDB_MIGRATIONS_DIR: /app/infrastructure/duckdb/migrations
      HOST: 0.0.0.0
      NATS_SERVERS: nats://nats:4222
      PORT: 3000
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - catalogue-data:/var/lib/workspace-brain
    networks:
      - backend
      - api-host
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # LibreChat starts the MCP server itself over stdio, so the server is baked
  # into the LibreChat image (librechat/Dockerfile) at /app/mcp/workspace-brain.
  librechat:
    image: workspace-brain-librechat:local
    build:
      context: ../..
      dockerfile: deploy/compose/librechat/Dockerfile
    profiles: [librechat]
    # Fail fast, with a clear message, if the secrets were not provided.
    entrypoint:
      - /bin/sh
      - -c
      - |
        missing=""
        for v in CREDS_KEY CREDS_IV JWT_SECRET JWT_REFRESH_SECRET; do
          [ -n "$$(printenv $$v)" ] || missing="$$missing $$v"
        done
        if [ -n "$$missing" ]; then
          echo "LibreChat secrets missing:$$missing. Run: pnpm librechat:env" >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    command: ['npm', 'run', 'backend']
    ports:
      - '127.0.0.1:${LIBRECHAT_PORT:-3080}:3080'
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      DOMAIN_CLIENT: http://localhost:${LIBRECHAT_PORT:-3080}
      DOMAIN_SERVER: http://localhost:${LIBRECHAT_PORT:-3080}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:-}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:-}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:-}
      ALLOW_REGISTRATION: 'true'
      SEARCH: 'false'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-user_provided}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-user_provided}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
    networks:
      - librechat
      - api-host
    depends_on:
      librechat-mongo:
        condition: service_healthy
      workspace-brain-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  librechat-mongo:
    image: mongo:7.0
    profiles: [librechat]
    command: ['mongod', '--noauth', '--bind_ip_all']
    volumes:
      - librechat-mongo-data:/data/db
    networks:
      - librechat
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Runs the MCP smoke test inside the LibreChat image, launching the server
  # exactly as librechat.yaml does. Opt in with --profile test.
  workspace-brain-mcp-smoke:
    image: workspace-brain-librechat:local
    build:
      context: ../..
      dockerfile: deploy/compose/librechat/Dockerfile
    profiles: [test]
    entrypoint:
      [
        'node',
        '/app/mcp/workspace-brain/dist/smoke/cli.js',
        '--librechat-config',
        '/app/librechat.yaml',
      ]
    command: ['--scenario', 'happy']
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
    networks:
      - api-host
    depends_on:
      workspace-brain-api:
        condition: service_healthy

  ingestion-worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        TURBO_BUILD_ARGS: ${TURBO_BUILD_ARGS:-}
    command: ['node', 'apps/ingestion-worker/dist/main.js']
    environment:
      LOG_LEVEL: info
      NATS_SERVERS: nats://nats:4222
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-300000}
    volumes:
      - '${WORKSPACE_SOURCES_PATH:-../../sources}:/sources:ro'
    networks:
      - backend
    depends_on:
      workspace-brain-api:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  knowledge-worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        TURBO_BUILD_ARGS: ${TURBO_BUILD_ARGS:-}
    command: ['node', 'apps/knowledge-worker/dist/main.js']
    environment:
      LOG_LEVEL: info
      NATS_SERVERS: nats://nats:4222
    networks:
      - backend
    depends_on:
      ingestion-worker:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222'
      - '127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    networks:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333'
      - '127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    internal: true
  api-host:
  librechat:
    internal: true

volumes:
  catalogue-data:
  nats-data:
  qdrant-data:
  ollama-data:
  librechat-uploads:
  librechat-logs:
  librechat-mongo-data:
